[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airfaans"
version = "0.1.0"
description = "Geometry-aware surrogate models for aerodynamic flow fields."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Triasha Sarkar"}]
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
ml = ["torch>=2.4,<3", "torch-geometric>=2.6,<3"]
airfrans = ["pyvista>=0.44,<1", "scipy>=1.13,<2"]
tracking = ["mlflow>=2.16,<4", "dask>=2024.8,<2027"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
airfaans = "airfaans.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
